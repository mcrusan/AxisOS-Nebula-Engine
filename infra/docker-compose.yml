# Description: Docker Compose stack for running AxisOS Nebula Engine connected
#              to Nebius Token Factory and local AxisOS Sovereign Triad nodes.
# Changelog:
#   - 2026-10-20 (MFC/AGY): Created compose specification.
# ==============================================================================
version: "3.9"

services:
  nebula-engine:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: axisos-nebula-engine
    ports:
      - "8090:8090"
    environment:
      - APP_ENV=production
      - APP_PORT=8090
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-your_nebius_token_factory_api_key_here}
      - NEBIUS_BASE_URL=${NEBIUS_BASE_URL:-https://api.studio.nebius.com/v1}
      - NVIDIA_MODEL_NANO=nvidia/Llama-3_1-Nemotron-Nano-8B-v1
      - NVIDIA_MODEL_SUPER=nvidia/Llama-3_3-Nemotron-Super-49B-v1
      - NVIDIA_MODEL_ULTRA=nvidia/Llama-3_1-Nemotron-Ultra-253B-v1
      - AXISOS_CLOUD_OUTPOST_URL=https://axisos-sovereign-triad-4zye7tn3qq-uw.a.run.app
    restart: unless-stopped
